<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <title>Почетни поставки | Student Meal Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .onboarding-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .onboarding-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <h1>🍽️ Student Meal Planner</h1>
        <div class="subtitle">Заврши го твојот профил</div>

        <form method="POST" action="{{ url_for('onboarding') }}">
            <div class="form-row">
                <div class="form-group">
                    <label>📏 Висина (cm)</label>
                    <input type="number" name="height" required placeholder="на пр. 175" step="1" min="100" max="250">
                </div>
                <div class="form-group">
                    <label>⚖️ Тежина (kg)</label>
                    <input type="number" name="weight" required placeholder="на пр. 70" step="0.5" min="30" max="200">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>🎂 Возраст</label>
                    <input type="number" name="age" required placeholder="на пр. 20" step="1" min="15" max="100">
                </div>
                <div class="form-group">
                    <label>👤 Пол</label>
                    <select name="gender">
                        <option value="male">👨 Машки</option>
                        <option value="female">👩 Женски</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>🎯 Цел</label>
                <select name="goal" required>
                    <option value="maintain">⚖️ Одржување на тежина</option>
                    <option value="weight_loss">🏃‍♂️ Слабеење (намали 400 kcal на ден)</option>
                    <option value="muscle_gain">💪 Зголемување маса (додади 400 kcal на ден)</option>
                </select>
            </div>

            <button type="submit">🎯 Започни со планирање</button>
        </form>
    </div>
</body>
</html>
